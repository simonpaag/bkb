steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/bk-bolvaerket:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/bk-bolvaerket:latest
      - .
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bk-bolvaerket
      - --image=gcr.io/$PROJECT_ID/bk-bolvaerket:$COMMIT_SHA
      - --region=europe-west1
      - --max-instances=1
      - --memory=512Mi
      - --cpu=1
      - --allow-unauthenticated
      - --quiet

images:
  - gcr.io/$PROJECT_ID/bk-bolvaerket:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/bk-bolvaerket:latest
